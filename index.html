<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#090C13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link rel="manifest" href="manifest.webmanifest">
<title>Mariboy's Muscle Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090C13;--sheet:#0F1420;--surface:#141A27;--line:#1E2636;--line2:#2A3347;
  --text:#EEF2F8;--muted:#8B95A8;--accent:#5B9BFF;--on-accent:#061026;
  --p:#34D3B0;--c:#F2A541;--f:#B79CFF;
  --cut:#5B9BFF;--bulk:#FF9A8A;--maint:#8B95A8;--danger:#FF7A7A;
  --st:max(0px,calc(env(safe-area-inset-top,0px) + var(--adjT,0px)));--sb:max(0px,calc(var(--sbBase,env(safe-area-inset-bottom,0px)) + var(--adjB,0px)));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
input{font-size:16px}
html,body{overflow:hidden}
/* #app is sized from the real window height (see fit()) and can be nudged down in Settings → Screen fit.
   The transform makes every fixed element (tab bar, sheets, toasts) move with it. */
#app{position:fixed;top:0;left:0;right:0;height:var(--apph,100%);display:flex;flex-direction:column;transform:translateZ(0);overflow:hidden}
.titlebtn{border:0;background:none;padding:0;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}
.modechip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px 0 10px;border-radius:999px;background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.menu{position:absolute;left:16px;right:16px;top:calc(var(--st) + 50px);border-radius:18px;background:var(--surface);padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.menu button{width:100%;border:0;background:none;display:flex;align-items:center;gap:14px;padding:12px;border-radius:12px;text-align:left}
.menu button.on{background:var(--line)}
.check{width:26px;height:26px;flex:none;border-radius:999px;border:1.5px solid var(--line2);background:none;display:flex;align-items:center;justify-content:center;color:var(--on-accent);padding:0}
.check.on{background:var(--accent);border-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:2px;border-radius:999px;background:var(--surface);padding:2px}
.stepper button{width:34px;height:34px;border:0;border-radius:999px;background:none;color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.dock{position:fixed;left:16px;right:16px;bottom:calc(var(--sb) + 76px);z-index:11}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 14px) 20px 120px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.title{margin:0;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:-.01em}
.h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.02em}
.sec{margin:0;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column}
.rowc{display:flex;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--surface);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:999px;flex:none;display:inline-block}
.track{height:4px;border-radius:999px;background:var(--surface);overflow:hidden;display:flex}
.track>span{height:100%;display:block}
.btn{border:0;background:none;font-size:15px;font-weight:600;color:var(--accent);min-height:44px;padding:0 10px}
.btn-primary{border:0;width:100%;height:54px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:600}
.btn-soft{border:1px solid #2B4A80;width:100%;height:52px;border-radius:14px;background:#14223D;color:var(--text);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-danger{border:1px solid var(--danger);width:100%;height:48px;border-radius:12px;background:none;color:var(--danger);font-size:15px;font-weight:500}
.iconbtn{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:var(--text);padding:0;flex:none}
.plus{width:44px;height:44px;border-radius:999px;border:1px solid var(--line2);background:none;color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.seg{display:grid;gap:2px;padding:3px;border-radius:12px;background:var(--surface)}
.seg button{height:36px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.seg button.on{background:var(--line2);color:var(--text)}
.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:12px;background:var(--surface);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:none;background:none;color:var(--text)}
.item{width:100%;min-height:60px;border:0;border-bottom:1px solid #1B2232;background:none;text-align:left;display:flex;align-items:center;gap:14px;padding:0}
.item .nm{font-size:16px;font-weight:500;display:flex;align-items:center;gap:7px}
.item .sub{font-size:12px;color:var(--muted);margin-top:3px}
.tile{width:40px;height:40px;flex:none;border-radius:12px;background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center;gap:1px}
.card{border-radius:16px;background:var(--surface);padding:14px 16px}
.field{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:12px;background:var(--surface)}
.field span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.field input,.field select{border:0;outline:none;background:none;padding:0;font-size:17px;font-weight:600;width:100%;min-width:0}
.field select{appearance:none;-webkit-appearance:none}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:none;font-size:13px;font-weight:500}
.chip.on{border-color:var(--accent);background:#14223D}
.empty{padding:28px 8px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.tabbar{position:fixed;left:0;right:0;bottom:0;padding:8px 12px var(--sb);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(9,12,19,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:10}
.tabbar button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:500;height:50px;justify-content:center}
.tabbar button.on{color:var(--text);font-weight:600}
.fab{position:fixed;right:20px;bottom:calc(var(--sb) + 82px);width:58px;height:58px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;z-index:11;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.layer{position:fixed;inset:0;display:flex;flex-direction:column}
.backdrop{position:absolute;inset:0;background:rgba(2,4,9,.72)}
.sheet{position:absolute;left:0;right:0;bottom:0;top:calc(var(--st) + 10px);background:var(--sheet);border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden}
.grab{width:36px;height:5px;border-radius:999px;background:var(--line2);margin:8px auto 0}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column}
.page .scroll{padding:0 20px calc(var(--sb) + 40px)}
.pagehead{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--st) + 6px) 10px 6px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keypad button{height:50px;border:0;border-radius:10px;background:var(--surface);font-size:22px;font-weight:500}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--sb) + 150px);height:52px;padding:0 8px 0 16px;border-radius:14px;background:#1E2636;display:flex;align-items:center;justify-content:space-between;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.4);font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal button{position:relative;height:44px;border-radius:11px;border:0;font-size:14px;font-weight:600;padding:0;background:transparent}
.cal .mk{position:absolute;top:3px;right:5px;font-size:9px;font-weight:700;color:var(--text);opacity:.8}
.cal .off{position:absolute;left:50%;bottom:5px;width:4px;height:4px;margin-left:-2px;border-radius:999px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk button{height:60px;border-radius:12px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
input[type=time],input[type=date]{color-scheme:dark}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">
<script>
'use strict';
/* ---------- constants ---------- */
const KEY = 'mmm.v1';
const COLORS = { D: '#5B9BFF', M: '#8B95A8', S: '#FF9A8A' };

  cut: { name: 'Cut', color: '#5B9BFF', main: 'D' },
  maintain: { name: 'Maintain', color: '#8B95A8', main: 'M' },
  bulk: { name: 'Bulk', color: '#FF9A8A', main: 'S' }
};
const DTYPES = {
  D: { name: 'Deficit', bg: '#1C3260', fg: '#9CC2FF' },
  M: { name: 'Maintenance', bg: '#2A3142', fg: '#D5DBE6' },
  S: { name: 'Surplus', bg: '#4A2A28', fg: '#FFB8AD' }
};
const ICONS = {
  bread: ['Bread', 'M6 11a3 3 0 0 1 0-6h12a3 3 0 0 1 0 6v8H6z'],
  bowl: ['Bowl', 'M4 11h16a8 8 0 0 1-16 0z M9 7.5c0-1.2 1-1.8 1-3 M13.5 7.5c0-1.2 1-1.8 1-3'],
  shake: ['Shake', 'M7 5h10l-1.6 15H8.6z M7.4 9h9.2 M12 5l2-2.5'],
  cup: ['Coffee', 'M5 8h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z M16 10h1.5a2.5 2.5 0 0 1 0 5H16 M8 4.5v1.5 M11.5 4.5v1.5'],
  apple: ['Fruit', 'M12 8c-3-2-7.5-.5-7.5 4.5 0 4 3 8 5 8 1 0 1.5-.5 2.5-.5s1.5.5 2.5.5c2 0 5-4 5-8C19.5 7.5 15 6 12 8z M12 8c0-2 1-3.5 3-4.5'],
  wok: ['Wok', 'M2.5 11h15a7.5 6 0 0 1-15 0z M17.5 11.5l4-1.5 M8 4l3.5 5.5 M11.5 3.5l2 5.5'],
  pasta: ['Pasta', 'M3 16h18 M5 16a7 7 0 0 1 14 0 M8 16a4 4 0 0 1 8 0 M11 16a1 1 0 0 1 2 0 M6 19h12'],
  pizza: ['Pizza', 'M12 21L3.5 6.5a16 16 0 0 1 17 0z M5 8.8a14 14 0 0 1 14 0 M10 11.5h.01 M14 12h.01 M12 15.5h.01'],
  leaf: ['Salad', 'M5 19c0-8 6-14 14-14 0 8-6 14-14 14z M5 19l8-8'],
  lentil: ['Curry', 'M3.5 9c2-2 5.5-2 7.5 0-2 2-5.5 2-7.5 0z M13 9c2-2 5.5-2 7.5 0-2 2-5.5 2-7.5 0z M8.25 15.5c2-2 5.5-2 7.5 0-2 2-5.5 2-7.5 0z']
};
const WD = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
const WDL = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

/* ---------- helpers ---------- */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const r1 = (n) => Math.round(n * 10) / 10;
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return ymd(d); };
const dow = (k) => (parse(k).getDay() + 6) % 7;
const todayKey = () => ymd(new Date());
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const dLabel = (k) => { const d = parse(k); return WDL[dow(k)] + ', ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const dShort = (k) => { const d = parse(k); return d.getDate() + ' ' + MON[d.getMonth()]; };
const hm = (ts) => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const keyOf = (ts) => ymd(new Date(ts));
const kcalOf = (t) => Math.round(t.p * 4 + t.c * 4 + t.f * 9);
const num = (v, d = 0) => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : d; };
const icon = (k, size = 18, color = 'currentColor', sw = 1.8) => k && ICONS[k] ? `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[k][1]}"/></svg>` : '';
const svg = (d, size = 20, sw = 2) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  plus: '<path d="M12 5v14M5 12h14"/>', back: '<path d="M15 5l-7 7 7 7"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  chev: '<path d="M9 5l7 7-7 7"/>', search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>', list: '<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
  bars: '<path d="M5 20V11M12 20V4M19 20v-6"/>', sliders: '<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  star: '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
  pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/>', trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  box: '<path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/>', plan: '<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  cart: '<path d="M3 4h2.5l2.2 11h10.6L20.5 8H7"/><circle cx="9.5" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', minus: '<path d="M5 12h14"/>', down: '<path d="M7 10l5 5 5-5"/>',
  share: '<path d="M12 4v11M8 8l4-4 4 4M6 13v6h12v-6"/>', flame: '<path d="M12 21c4 0 6.5-2.7 6.5-6.3 0-4-3.3-6.2-4.5-9.7-2.2 1.6-3.2 3.9-3 6.3-1.3-.8-2-2.2-2.1-3.6C7.3 9.3 5.5 11.8 5.5 14.7 5.5 18.3 8 21 12 21z"/>'
};
const LOGO = `<svg width="22" height="22" viewBox="0 0 100 100" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path stroke="#5B9BFF" d="M28 8C26 18 17 28 17 44C17 52 18 58 19.5 64 M72 8C74 18 83 28 83 44C83 52 82 58 80.5 64 M50 38V54"/><path stroke="#34D3B0" d="M24 94C22 84 20.5 74 19.5 64C27 75 44 75 50 58C56 75 73 75 80.5 64C79.5 74 78 84 76 94"/></svg>`;
const MODES = { cal: { name: 'Calorie tracker', short: 'Calories', sub: 'Calories, macros and periods', ic: I.flame }, stash: { name: 'Stash tracker', short: 'Stash', sub: 'Groceries at home, meal plan, shopping', ic: I.box } };
const titleLine = () => `<button type="button" class="titlebtn" data-a="appMenu" aria-label="Switch mode, now ${MODES[ui.app].name}" aria-haspopup="menu"><p class="title">${LOGO}<span>Mariboy's <span style="color:var(--accent)">Muscle Maker</span></span></p><span class="modechip">${MODES[ui.app].short}${svg(I.down, 14, 2.2)}</span></button>`;

/* ---------- state ---------- */
function defaultTargets(maint) {
  const mk = (k, p, f) => ({ p, f, c: Math.max(0, Math.round((k - p * 4 - f * 9) / 4)) });
  return { D: mk(maint - 500, 150, 60), M: mk(maint, 150, 72), S: mk(maint + 300, 150, 80) };
}
function freshState() {
  const t = todayKey();
  return {
    v: 2, maintenance: 2400, foods: [], meals: [], log: [], lastExport: null, stash: [], plan: [], shop: [], cart: {},
    periods: [{ id: uid(), goal: 'maintain', start: t, end: null, week: Array(7).fill('M'), targets: defaultTargets(2400) }]
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || freshState(); } catch (e) { S = freshState(); }
function migrate(d) {
  d.stash = d.stash || []; d.plan = d.plan || []; d.shop = d.shop || []; d.cart = d.cart || {};
  if (!d.v || d.v < 2) d.v = 2;
  return d;
}
migrate(S);
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } };
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save — storage full or blocked'); } }

const ui = { app: lsGet('mmm.app', 'cal') === 'stash' ? 'stash' : 'cal', stab: 'stash', stashQ: '', appMenu: false, qty: null, newPortion: null, shopAdd: null, dialog: null, tab: 'today', day: null, foodsSeg: 'foods', foodsQ: '', sheet: null, portion: null, iconPick: null, edit: null, toast: null, off: null };

const food = (id) => S.foods.find((f) => f.id === id);
const meal = (id) => S.meals.find((m) => m.id === id);
function nut(f, g) { const k = g / 100; return { kcal: f.kcal100 * k, p: f.p100 * k, c: f.c100 * k, f: f.f100 * k }; }
function mealNut(m) {
  const t = { kcal: 0, p: 0, c: 0, f: 0 };
  m.items.forEach((it) => { const fd = food(it.foodId); if (!fd) return; const n = nut(fd, it.g); t.kcal += n.kcal; t.p += n.p; t.c += n.c; t.f += n.f; });
  return t;
}
const unitOf = (f) => (f && f.unit === 'ml' ? 'ml' : 'g');
const portionOf = (f, label) => (f && label ? (f.portions || []).find((p) => p.label === label) : null);
/* how a food is usually logged: the last portion unit (e.g. 1.5 jars) if it still exists, else the last grams */
function defaultPortion(f) {
  const p = portionOf(f, f.lastUnit);
  if (p && f.lastCount > 0) return { g: f.lastCount * p.g, pu: { label: p.label, n: f.lastCount } };
  return { g: f.lastGrams || (f.portions[0] && f.portions[0].g) || 100, pu: null };
}
const defaultGrams = (f) => defaultPortion(f).g;
const unitName = (label) => String(label || '').trim().replace(/^(1|one|ein|eine)\s+/i, '') || 'portion';
const plural = (w, n) => { if (Math.abs(n - 1) < 1e-9) return w; if (w === 'pc') return 'pcs'; if (/(s|x|ch|sh)$/i.test(w) || /[^a-z]$/i.test(w)) return w; return w + 's'; };
const fmtN = (n) => { const r = Math.round(n * 10) / 10; return Number.isInteger(r) ? r.toLocaleString('en-US') : r.toFixed(1); };
const countLabel = (label, n) => fmtN(n) + ' ' + plural(unitName(label), n);
function amountLabel(f, g, pu) { const u = unitOf(f); return pu ? countLabel(pu.label, pu.n) + ' · ' + fmt(g) + ' ' + u : fmt(g) + ' ' + u; }

/* ---------- stash helpers ---------- */
const PACK_RE = /pack|jar|can\b|bottle|box|bag|tin\b|tub|carton|net|bunch|packung|glas|dose|flasche|beutel|becher|tüte|netz|bund|schale/i;
function packOfFood(f) { if (!f) return null; const p = (f.portions || []).find((x) => PACK_RE.test(x.label) && x.g > 0); return p ? { label: unitName(p.label), size: p.g } : null; }
const sItem = (id) => S.stash.find((x) => x.id === id);
const stashOf = (foodId) => (foodId ? S.stash.find((x) => x.foodId === foodId) : null);
function sUnit(it) { const f = it.foodId && food(it.foodId); return f ? unitOf(f) : (it.unit || 'pcs'); }
function sName(it) { const f = it.foodId && food(it.foodId); return f ? f.name : (it.name || 'Item'); }
const fmtU = (a, u) => (u === 'pcs' ? fmtN(a) + (Math.abs(a - 1) < 1e-9 ? ' pc' : ' pcs') : fmt(a) + ' ' + u);
const hasPack = (it) => !!(it && it.pack && it.pack.size > 0);
function amtMain(it, a = it.amount) { return hasPack(it) ? fmtN(a / it.pack.size) + ' ' + plural(it.pack.label, a / it.pack.size) : fmtU(a, sUnit(it)); }
function amtSub(it, a = it.amount) { return hasPack(it) ? fmtU(a, sUnit(it)) : ''; }
const isOut = (it) => !(it.amount > 0.0001);
const isLow = (it) => it.min != null && it.amount <= it.min + 0.0001;
function addStock(it, a) { it.amount = Math.max(0, (it.amount || 0) + a); if (a > 0) it.full = it.amount; if (it.amount < 0.0001) it.amount = 0; it.updated = Date.now(); }
function takeStash(f, g) {
  const it = stashOf(f.id); if (!it || isOut(it)) return null;
  const t = Math.min(it.amount, g); addStock(it, -t); return { id: it.id, g: t };
}
function giveStash(st) { if (!st) return; const it = sItem(st.id); if (it) addStock(it, st.g); }
function newStashItem(f, extra = {}) {
  const it = { id: uid(), foodId: f ? f.id : null, name: f ? '' : (extra.name || ''), unit: f ? unitOf(f) : (extra.unit || 'pcs'), amount: 0, full: 0, pack: f ? packOfFood(f) : null, min: null, updated: Date.now() };
  return Object.assign(it, extra);
}

/* ---------- periods & targets ---------- */
const periodsSorted = () => [...S.periods].sort((a, b) => (a.start < b.start ? -1 : 1));
function periodFor(k) {
  let found = null;
  periodsSorted().forEach((p) => { if (p.start <= k && (!p.end || k <= p.end)) found = p; });
  return found;
}
function plannedType(p, k) { if (!p) return 'M'; if (p.goal === 'maintain') return 'M'; return p.week[dow(k)] || GOALS[p.goal].main; }
function targetFor(k) {
  const p = periodFor(k); const type = plannedType(p, k);
  const base = p ? p.targets[type] : defaultTargets(S.maintenance).M;
  const t = { p: base.p, c: base.c, f: base.f };
  return { period: p, type, ...t, kcal: kcalOf(t) };
}
function dayTotals(k) {
  const t = { kcal: 0, p: 0, c: 0, f: 0, n: 0 };
  S.log.forEach((e) => { if (keyOf(e.ts) === k) { t.kcal += e.kcal; t.p += e.p; t.c += e.c; t.f += e.f; t.n++; } });
  return t;
}
function direction(kcal) { const m = S.maintenance; if (kcal < m * 0.95) return 'D'; if (kcal > m * 1.05) return 'S'; return 'M'; }

/* ---------- actions ---------- */
function tsFor(k) {
  const now = new Date();
  if (k === todayKey()) return now.getTime();
  const d = parse(k); d.setHours(now.getHours(), now.getMinutes(), 0, 0); return d.getTime();
}
function logFood(f, g, ts, pu, noStash) {
  const n = nut(f, g);
  const e = { id: uid(), ts, foodId: f.id, name: f.name, g, kcal: n.kcal, p: n.p, c: n.c, f: n.f };
  if (pu) { e.pu = pu.label; e.pn = pu.n; }
  e.st = noStash ? null : takeStash(f, g);
  S.log.push(e);
  f.uses = (f.uses || 0) + 1; f.lastUsed = Date.now(); f.lastGrams = g;
  if (pu !== undefined) { f.lastUnit = pu ? pu.label : null; f.lastCount = pu ? pu.n : null; }
  return e;
}
/* toast text after logging: also says what's left in Stash */
function loggedText(name, kcal, entries) {
  const st = entries.map((e) => e.st).filter(Boolean);
  let tail = '';
  if (st.length === 1) { const it = sItem(st[0].id); if (it) tail = isOut(it) ? ' · Stash: out' : ' · ' + amtMain(it) + ' left'; }
  else if (st.length > 1) tail = ' · ' + st.length + ' taken from Stash';
  return name + ' logged · ' + fmt(kcal) + ' kcal' + tail;
}
function logMeal(m, ts, noStash) {
  const ids = [];
  m.items.forEach((it) => { const f = food(it.foodId); if (f) ids.push(logFood(f, it.g, ts, undefined, noStash).id); });
  m.uses = (m.uses || 0) + 1; m.lastUsed = Date.now();
  const pl = S.plan.find((x) => x.mealId === m.id);
  if (pl) { pl.n -= 1; if (pl.n <= 0) S.plan = S.plan.filter((x) => x !== pl); ids.plan = m.id; }
  return ids;
}
function ask(text, okLabel, fn, danger = true) { ui.dialog = { text, okLabel, fn, danger }; }
function info(text) { ui.dialog = { text, okLabel: 'OK', info: true }; }

/* ---------- render: shared pieces ---------- */
function macroBars(tot, tgt) {
  return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">${[['Protein', 'p', '--p'], ['Carbs', 'c', '--c'], ['Fat', 'f', '--f']].map(([l, k, col]) => {
    const pct = tgt[k] ? Math.min(100, tot[k] / tgt[k] * 100) : 0;
    return `<div class="stack" style="gap:8px"><span style="font-size:12px;font-weight:500" class="muted">${l}</span>
      <div class="track"><span style="width:${pct}%;background:var(${col});border-radius:999px"></span></div>
      <span class="num" style="font-size:13px">${Math.round(tot[k])}<span class="muted"> / ${Math.round(tgt[k])} g</span></span></div>`;
  }).join('')}</div>`;
}

  return `<div class="track" aria-hidden="true" style="height:${h}px"><div style="width:${w}%;display:flex;border-radius:999px;overflow:hidden">
    <span style="width:${pk / s * 100}%;background:var(--p)"></span><span style="width:${ck / s * 100}%;background:var(--c)"></span><span style="width:${fk / s * 100}%;background:var(--f)"></span></div></div>`;
}

}
function tabbar() {

/* ---------- Today / day view ---------- */
function renderDay(k, isToday) {

  const maxK = Math.max(0, ...entries.map((e) => e.kcal));

    ? `<div class="stack" style="gap:14px">${titleLine()}<div class="between" style="align-items:flex-end"><div class="stack" style="gap:4px"><span class="muted" style="font-size:13px;font-weight:500">${dLabel(k)}</span><h1 class="h1">Today</h1></div>${periodPill(tg)}</div></div>`
    : `<div class="stack" style="gap:10px"><div style="margin:0 -10px"><button class="btn" type="button" data-a="dayBack" style="display:flex;align-items:center;gap:4px;font-weight:400;font-size:16px">${svg(I.back)}History</button></div>
       <div class="between" style="align-items:flex-end"><div class="stack" style="gap:4px"><span class="muted" style="font-size:13px;font-weight:500">${k > todayKey() ? 'Upcoming day' : 'Past day · editable'}</span><h1 class="h1" style="font-size:28px">${dLabel(k)}</h1></div>${periodPill(tg)}</div></div>`;
  return `<div class="stack" style="gap:26px">${head}
    <section aria-label="Calories" class="stack" style="gap:12px">
      <div class="between" style="align-items:baseline"><div class="rowc" style="gap:8px;align-items:baseline"><span class="num" style="font-size:52px;font-weight:600;letter-spacing:-.03em;line-height:1">${fmt(Math.abs(left))}</span><span class="muted" style="font-size:15px">kcal ${over ? 'over' : 'left'}</span></div>
      <span class="muted num" style="font-size:13px">${fmt(tot.kcal)} / ${fmt(tg.kcal)}</span></div>
      <div class="track" style="height:10px"><span style="width:${fillA}%;background:var(--accent)"></span>${over ? `<span style="width:${100 - fillA}%;background:var(--bulk)"></span>` : ''}</div>
    </section>
    <section aria-label="Macros">${macroBars(tot, tg)}</section>
    <section aria-label="Timeline" class="stack" style="gap:10px">
      <h2 class="sec" style="font-size:13px">Timeline</h2>
      ${entries.length ? `<div class="stack">${entries.map((e) => {
        const f = food(e.foodId); const ic = f && f.fav ? f.icon : null;
        return `<button type="button" data-a="editEntry" data-id="${e.id}" style="display:flex;gap:16px;border:0;background:none;padding:0;text-align:left;width:100%">
          <div style="width:10px;display:flex;flex-direction:column;align-items:center;align-self:stretch"><span style="width:9px;height:9px;border-radius:999px;border:2px solid var(--accent);margin-top:4px"></span><span style="flex:1;width:1px;background:var(--line)"></span></div>
          <div class="stack" style="flex:1;gap:6px;padding-bottom:16px;min-width:0">
            <div class="between" style="align-items:baseline"><span class="muted num" style="font-size:12px">${hm(e.ts)} · ${e.pu ? esc(countLabel(e.pu, e.pn)) + ' · ' : ''}${fmt(e.g)} ${unitOf(f)}</span><span class="num" style="font-size:16px;font-weight:600">${fmt(e.kcal)}</span></div>
            <div class="between" style="align-items:baseline"><span class="rowc" style="gap:8px;font-size:16px;font-weight:500;min-width:0">${icon(ic, 18, 'var(--accent)')}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.name)}</span></span><span class="muted num" style="font-size:12px;white-space:nowrap">${tg.kcal ? Math.round(e.kcal / tg.kcal * 100) : 0}% of day</span></div>
            ${splitBar(e, maxK)}
          </div></button>`;
      }).join('')}</div>` : `<div class="empty">Nothing logged ${isToday ? 'yet' : 'on this day'}.<br>Tap <b style="color:var(--accent)">+</b> to add food.</div>`}
    </section></div>`;
}

function sheetList() {
  const sh = ui.sheet; const pick = !!sh.pick;
  if (sh.tab === 'recent') {
    const items = [...S.foods.filter((f) => f.lastUsed).map((f) => ({ t: 'f', o: f, u: f.lastUsed })), ...(pick ? [] : S.meals.filter((m) => m.lastUsed).map((m) => ({ t: 'm', o: m, u: m.lastUsed })))]

  html += `<div style="padding:18px 0 30px"><button type="button" class="btn-soft" data-a="createFood"><span style="width:26px;height:26px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center">${svg(I.plus, 14, 3)}</span>Not found? Create food</button>${pick && ui.sheet.pick === 'stash' ? `<button type="button" class="btn" data-a="otherItem" style="width:100%;margin-top:8px;font-weight:500">Not a food? Add other item${q ? ' "' + esc(sh.q.trim()) + '"' : ''}</button>` : ''}</div>`;

/* ---------- Portion ---------- */
function ptGrams(pt, f) { const p = portionOf(f, pt.unit); return p ? num(pt.val) * p.g : num(pt.val); }
function renderPortion() {
  const pt = ui.portion; const f = food(pt.foodId); if (!f) return '';
  const u = unitOf(f); const P = portionOf(f, pt.unit); const v = num(pt.val);
  const g = ptGrams(pt, f); const n = nut(f, g);
  const chips = [];
  if (P) [[0.5, '½'], [1, '1'], [1.5, '1½'], [2, '2'], [3, '3']].forEach(([x, l]) => chips.push([l, x]));
  else {
    if (f.lastGrams && !f.lastUnit) chips.push(['Last · ' + fmt(f.lastGrams) + ' ' + u, f.lastGrams]);

/* ---------- History ---------- */
function renderHistory() {
  if (ui.day) return renderDay(ui.day, false);
  const t = todayKey(); const P = periodFor(t);
  const start = P ? P.start : addDays(t, -27);
  const goal = P ? GOALS[P.goal] : GOALS.maintain;
  const types = P ? (P.goal === 'cut' ? ['D', 'M'] : P.goal === 'bulk' ? ['S', 'M'] : ['M']) : ['M'];
  // stats over past days with entries
  let onT = 0, logged = 0; const agg = {}; const mac = { p: 0, c: 0, f: 0, tp: 0, tc: 0, tf: 0, n: 0 };
  for (let k = start; k < t; k = addDays(k, 1)) {

    (agg[tg.type] = agg[tg.type] || { s: 0, n: 0, t: tg.kcal }); agg[tg.type].s += tot.kcal; agg[tg.type].n++;

  }

  const totalWeeks = P && P.end ? Math.ceil((daysBetween(P.start, P.end) + 1) / 7) : null;
  const avgCells = types.map((ty) => {
    const a = agg[ty]; const tgt = P ? kcalOf(P.targets[ty]) : kcalOf(defaultTargets(S.maintenance).M);
    return `<div class="stack" style="flex:1;gap:3px"><span class="muted" style="font-size:11px">Avg ${DTYPES[ty].name.toLowerCase()} day</span><span class="num" style="font-size:17px;font-weight:600">${a ? fmt(a.s / a.n) : '—'} <span class="muted" style="font-size:12px;font-weight:400">/ ${fmt(tgt)} kcal</span></span></div>`;
  }).join('');
  const macAvg = [['protein', 'p', 'tp', '--p'], ['carbs', 'c', 'tc', '--c'], ['fat', 'f', 'tf', '--f']].map(([l, k, tk, col]) => {
    const v = mac.n ? mac[k] / mac.n : 0, g = mac.n ? mac[tk] / mac.n : 0;
    return `<div class="stack" style="gap:6px"><span class="muted" style="font-size:11px">Avg ${l}</span><div class="track" style="background:#232B3D"><span style="width:${g ? Math.min(100, v / g * 100) : 0}%;background:var(${col});border-radius:999px"></span></div><span class="num" style="font-size:12px">${mac.n ? Math.round(v) : '—'}<span class="muted"> / ${mac.n ? Math.round(g) : '—'} g</span></span></div>`;
  }).join('');
  // calendar
  const calStart = addDays(start, -dow(start));
  const calEnd = addDays(t, 6 - dow(t));
  let weeks = '';
  for (let w = calStart; w <= calEnd; w = addDays(w, 7)) {
    const mid = addDays(w, 3); const wp = periodFor(mid); const cur = wp && P && wp.id === P.id;
    const band = wp ? GOALS[wp.goal].color : '#2A3347';
    let cells = '';
    for (let i = 0; i < 7; i++) {
      const k = addDays(w, i); const d = parse(k).getDate();
      const dp = periodFor(k); const planned = plannedType(dp, k); const inCur = P ? (dp && dp.id === P.id) : true;
      const mark = dp && dp.goal !== 'maintain' && planned === 'M' ? 'M' : '';
      const tot = dayTotals(k);
      let bg = 'transparent', fg = 'var(--muted)', border = '0', off = false, label;
      if (k === t) { border = '1.5px solid var(--accent)'; fg = 'var(--text)'; label = 'today'; if (tot.n) { const dir = direction(tot.kcal); bg = DTYPES[dir].bg; fg = DTYPES[dir].fg; } }
      else if (k > t) { fg = '#3A4458'; label = 'upcoming'; }
      else if (tot.n) {
        const dir = direction(tot.kcal); const tg = targetFor(k);
        bg = DTYPES[dir].bg; fg = DTYPES[dir].fg; off = Math.abs(tot.kcal - tg.kcal) > tg.kcal * 0.05;
        label = 'ate ' + fmt(tot.kcal) + ' kcal, ' + DTYPES[dir].name.toLowerCase() + (off ? ', off target' : ', on target');
      } else label = 'nothing logged';
      cells += `<button type="button" data-a="openDay" data-k="${k}" aria-label="${dShort(k)}, ${label}${mark ? ', planned maintenance day' : ''}" style="background:${bg};color:${fg};border:${border};opacity:${inCur ? 1 : 0.45}">${d}${mark && k <= t ? `<span class="mk">M</span>` : ''}${off ? `<span class="off" style="background:${fg}"></span>` : ''}</button>`;
    }
    weeks += `<div class="stack" style="gap:3px"><span style="height:3px;border-radius:999px;background:${band};opacity:${cur || !P ? 1 : 0.45}"></span><div class="cal num">${cells}</div></div>`;
  }
  const hasMarker = P && P.goal !== 'maintain';
  return `<div class="stack" style="gap:18px"><div class="stack" style="gap:14px">${titleLine()}<h1 class="h1">History</h1></div>
    <section class="card stack" aria-label="Current period" style="gap:14px;border-radius:18px">

        <div class="stack" style="align-items:flex-end;gap:3px"><span class="num" style="font-size:17px;font-weight:600">${onT}<span class="muted" style="font-size:12px;font-weight:400"> / ${logged}</span></span><span class="muted" style="font-size:12px">days on target</span></div></div>
      <div class="rowc" style="gap:10px;align-items:flex-start">${avgCells}</div>

        ${['D', 'M', 'S'].map((k) => `<span class="rowc" style="gap:6px"><span style="width:10px;height:10px;border-radius:3px;background:${COLORS[k]}"></span>${DTYPES[k].name}</span>`).join('')}

/* ---------- Settings ---------- */
function renderSettings() {

  let hi = t; ps.forEach((p) => { const e = p.end || addDays(p.start, 42); if (e > hi) hi = e; });
  if (daysBetween(lo, hi) < 28) hi = addDays(lo, 28);
  const span = daysBetween(lo, hi) + 1;
  let segs = '', cursor = lo;
  ps.forEach((p) => {
    if (p.start > cursor) segs += `<span style="flex:${daysBetween(cursor, p.start)}"></span>`;
    const e = p.end || hi; const s = p.start < cursor ? cursor : p.start;
    if (e >= s) segs += `<span style="flex:${daysBetween(s, e) + 1};border-radius:999px;background:${GOALS[p.goal].color};opacity:${(p.end && p.end < t) ? 0.45 : 1}"></span>`;
    if (addDays(e, 1) > cursor) cursor = addDays(e, 1);
  });
  const todayPct = daysBetween(lo, t) / span * 100;
  const cur = periodFor(t);
  const upcoming = ps.filter((p) => p.start > t);
  const rows = [...ps].reverse().sort((a, b) => {
    const rank = (p) => (p === cur ? 0 : p.start > t ? 1 : 2);
    return rank(a) - rank(b) || (rank(a) === 1 ? (a.start < b.start ? -1 : 1) : (a.start < b.start ? 1 : -1));

  }).join('');
  return `<div class="stack" style="gap:22px"><div class="stack" style="gap:14px">${titleLine()}<h1 class="h1">Settings</h1></div>
    <section class="stack" aria-label="Periods" style="gap:12px">

      <div class="stack" style="gap:8px"><div aria-hidden="true" style="position:relative;display:flex;gap:3px;height:10px">${segs}<span style="position:absolute;left:${todayPct}%;top:-4px;width:2px;height:18px;border-radius:999px;background:var(--text)"></span></div>
        <div class="between muted" style="font-size:11px"><span>${dShort(lo)}</span><span>today</span><span>${dShort(hi)}</span></div></div>

    </section>

      <label class="between" style="min-height:56px;padding:0 16px;border-radius:16px;background:var(--surface)"><span style="font-size:16px">Maintenance</span><span class="rowc" style="gap:6px"><input id="maint" value="${S.maintenance}" inputmode="numeric" aria-label="Maintenance calories" style="width:80px;border:0;outline:none;background:none;font-size:16px;font-weight:600;text-align:right;padding:0"><span class="muted" style="font-size:13px">kcal</span></span></label>

      <div class="stack" style="border-radius:16px;background:var(--surface);overflow:hidden">${[['t', 'Top space', 'Pushes the title down, away from the status bar'], ['b', 'Bottom space', 'Space under the tab bar icons']].map(([k, l, d], j) => `<div class="between" style="min-height:60px;padding:0 8px 0 16px;${j ? 'border-top:1px solid var(--line)' : ''}"><span class="stack" style="gap:2px;min-width:0"><span style="font-size:16px">${l} <span class="muted num" style="font-size:13px">${ADJ[k] ? (ADJ[k] > 0 ? '+' : '−') + Math.abs(ADJ[k]) : 'auto'}</span></span><span class="muted" style="font-size:12px">${d}</span></span>

/* ---------- Shopping ---------- */
function shopRows() {
  const need = {}; const why = {};
  S.plan.forEach((pl) => { const m = meal(pl.mealId); if (!m) return; m.items.forEach((it) => { if (!food(it.foodId)) return; need[it.foodId] = (need[it.foodId] || 0) + it.g * pl.n; (why[it.foodId] = why[it.foodId] || []).includes(m.name) || why[it.foodId].push(m.name); }); });

    if (miss > 0.5) plan.push({ key: 'f:' + fid, f, it, name: f.name, miss, u: unitOf(f), pack: hasPack(it) ? it.pack : packOfFood(f), note: 'need ' + fmt(miss) + ' ' + unitOf(f) + ' · ' + why[fid].join(', ') });
  });

/* ---------- Open Food Facts ---------- */
/* "500 g", "1,5 l", "4 x 125 g", "330ml" → amount in g/ml */
function parseQty(q) {
  const m = String(q || '').toLowerCase().replace(',', '.').match(/(?:(\d+)\s*[x×]\s*)?(\d+(?:\.\d+)?)\s*(kg|g|mg|l|cl|ml)\b/);
  if (!m) return null;
  const mult = m[1] ? +m[1] : 1; const v = +m[2]; const f = { kg: 1000, g: 1, mg: 0.001, l: 1000, cl: 10, ml: 1 }[m[3]];
  const r = Math.round(mult * v * f); return r > 0 ? r : null;
}
let offTimer, offSeq = 0;
function offSearch(q) {
  clearTimeout(offTimer);
  if (q.length < 3) { ui.off = null; return; }
  ui.off = { q, state: 'loading', items: [] };
  offTimer = setTimeout(async () => {
    const seq = ++offSeq;
    try {
      const url = 'https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=25&lc=de&cc=de&fields=code,product_name,product_name_de,product_name_en,brands,quantity,serving_size,nutriments&search_terms=' + encodeURIComponent(q);
      const res = await fetch(url); if (!res.ok) throw new Error('http');
      const data = await res.json(); if (seq !== offSeq) return;
      const items = (data.products || []).map((p) => {
        const n = p.nutriments || {};
        const kcal = n['energy-kcal_100g'] ?? (n['energy_100g'] ? n['energy_100g'] / 4.184 : null);
        const qty = p.quantity || '';
        return { code: p.code, name: (p.product_name_de || p.product_name || p.product_name_en || '').trim(), brand: (p.brands || '').split(',')[0].trim(), qty, serving: p.serving_size || '',
          unit: /\d\s*(ml|l|cl)\b/i.test(qty) ? 'ml' : 'g', kcal100: kcal, p100: n.proteins_100g, c100: n.carbohydrates_100g, f100: n.fat_100g };
      }).filter((p) => p.name && p.kcal100 != null && isFinite(p.kcal100));
      ui.off = { q, state: 'done', items };
    } catch (e) { if (seq === offSeq) ui.off = { q, state: 'error', items: [] }; }
    if (ui.sheet && ui.sheet.tab === 'search') { const b = document.getElementById('sheetBody'); if (b) b.innerHTML = searchResults(); }
  }, 450);
}

  draftGoal(el) {
    syncDraft(); const d = ui.edit.draft; const k = el.dataset.k; const main = GOALS[k].main;
    d.goal = k; if (k !== 'maintain') d.week = d.week.map((x) => (x === 'M' ? 'M' : main));
    if (k !== 'maintain' && d.week.every((x) => x === 'M')) d.week = [main, main, main, main, main, 'M', 'M'];
  },
  toggleDay(el) { syncDraft(); const d = ui.edit.draft; const i = +el.dataset.i; d.week[i] = d.week[i] === 'M' ? GOALS[d.goal].main : 'M'; },
  clearEnd() { syncDraft(); ui.edit.draft.end = null; },
  savePeriod() {
    syncDraft(); const d = ui.edit.draft;
    if (!d.start) { info('Please pick a start date.'); return 'keep'; }
    if (!d.end) d.end = null;
    if (d.end && d.end < d.start) { info('The end date is before the start date.'); return 'keep'; }
    // an open-ended period that started earlier simply ends the day before this one starts
    const closing = S.periods.filter((p) => p.id !== ui.edit.id && !p.end && p.start < d.start);
    const clash = S.periods.find((p) => p.id !== ui.edit.id && !closing.includes(p) && p.start <= (d.end || '9999-12-31') && d.start <= (p.end || '9999-12-31'));
    const id = ui.edit.id;
    const commit = () => {
      closing.forEach((p) => { p.end = addDays(d.start, -1); });
      const vals = { goal: d.goal, start: d.start, end: d.end, week: d.goal === 'maintain' ? Array(7).fill('M') : d.week, targets: d.targets };
      if (id) Object.assign(S.periods.find((p) => p.id === id), vals); else S.periods.push({ id: uid(), ...vals });
      save(); ui.edit = null;
    };
    if (clash) ask('This overlaps your ' + GOALS[clash.goal].name + ' period (' + dShort(clash.start) + ' – ' + (clash.end ? dShort(clash.end) : 'open-ended') + '). Where they overlap, the period that starts later wins.', 'Save anyway', commit, false);
    else commit();
  },
  deletePeriod() { ask('Delete this period? Your logged food stays; days in it fall back to maintenance targets.', 'Delete period', () => { S.periods = S.periods.filter((p) => p.id !== ui.edit.id); save(); ui.edit = null; }); },
  // mode switch
  appMenu() { ui.appMenu = true; },
  closeAppMenu() { ui.appMenu = false; },
  setApp(el) { ui.app = el.dataset.k; ui.appMenu = false; lsSet('mmm.app', ui.app); },
  stab(el) { ui.stab = el.dataset.k; },
  adj(el) { const k = el.dataset.k; ADJ[k] = Math.max(-60, Math.min(120, ADJ[k] + +el.dataset.d)); lsSet('mmm.adj', JSON.stringify(ADJ)); fit(); },
  adjReset() { ADJ.t = 0; ADJ.b = 0; lsSet('mmm.adj', JSON.stringify(ADJ)); fit(); },
  // stash
  stashAdd() { ui.sheet = { tab: S.foods.some((f) => f.lastUsed) ? 'recent' : 'search', q: '', pick: 'stash', date: todayKey() }; },
  editStash(el) { const it = sItem(el.dataset.id); openStashEdit(it.foodId ? food(it.foodId) : null, { id: it.id }); },
  sdUnit(el) { syncDraft(); ui.edit.draft.unit = el.dataset.k; },
  sdView(el) {
    syncDraft(); const d = ui.edit.draft; const k = el.dataset.k; if (k === d.view) return;
    const p = sdPack(d); const base = sdBase(d, d.amt); const minBase = d.minStr === '' ? null : sdBase(d, d.minStr);
    d.view = k;
    const conv = (b) => String(Math.round((k === 'pack' && p ? b / p.size : b) * 100) / 100);
    d.amt = conv(base); if (minBase != null) d.minStr = conv(minBase);
  },
  sdStep(el) {
    syncDraft(); const d = ui.edit.draft; const dir = +el.dataset.k; const u = d.foodId && food(d.foodId) ? unitOf(food(d.foodId)) : d.unit;
    const step = d.view === 'pack' && sdPack(d) ? 1 : u === 'pcs' ? 1 : 50;
    const v = Math.max(0, num(d.amt) + dir * step); d.amt = String(Math.round(v * 100) / 100);
  },
  sdPackChip(el) {
    syncDraft(); const d = ui.edit.draft; const base = sdBase(d, d.amt); const minBase = d.minStr === '' ? null : sdBase(d, d.minStr);
    d.packLabel = el.dataset.l; d.packSize = el.dataset.g; const p = sdPack(d);
    if (d.view === 'base' && !ui.edit.id) d.view = 'pack';
    const conv = (b) => String(Math.round((d.view === 'pack' ? b / p.size : b) * 100) / 100);
    d.amt = ui.edit.id || base ? conv(base) : '1'; if (minBase != null) d.minStr = conv(minBase);
  },
  saveStash() {
    syncDraft(); const d = ui.edit.draft; const f = d.foodId && food(d.foodId);
    if (!f && !d.name.trim()) { info('Please give the item a name.'); return; }
    const pack = sdPack(d); if (d.view === 'pack' && !pack) d.view = 'base';
    const amount = Math.max(0, sdBase(d, d.amt)); const min = String(d.minStr).trim() === '' ? null : Math.max(0, sdBase(d, d.minStr));
    let it = ui.edit.id ? sItem(ui.edit.id) : null;
    if (!it) { it = newStashItem(f, { name: f ? '' : d.name.trim(), unit: f ? unitOf(f) : d.unit }); S.stash.push(it); }
    const grew = amount > it.amount + 0.0001;
    Object.assign(it, { name: f ? '' : d.name.trim(), unit: f ? unitOf(f) : d.unit, pack, min, amount, updated: Date.now() });
    if (grew || !(it.full > 0) || it.full < amount) it.full = amount;
    if (f && pack && !f.portions.some((x) => Math.abs(x.g - pack.size) < 0.01)) f.portions.push({ label: '1 ' + pack.label, g: pack.size });
    save(); ui.edit = null; toast(sName(it) + ' · ' + (isOut(it) ? 'out' : amtMain(it)) + ' in Stash');
  },
  deleteStash() { const it = sItem(ui.edit.id); ask('Remove "' + sName(it) + '" from Stash?', 'Remove', () => { S.stash = S.stash.filter((x) => x !== it); delete S.cart['s:' + it.id]; save(); ui.edit = null; }); },
  // plan
  planAdd() { ui.mealPick = true; },
  closeMealPick() { ui.mealPick = false; },
  planAddMeal(el) {
    const m = meal(el.dataset.id); const pl = S.plan.find((x) => x.mealId === m.id);
    if (pl) pl.n += 1; else S.plan.push({ id: uid(), mealId: m.id, n: 1 });
    save(); ui.mealPick = false; toast(m.name + ' added to plan');
  },
  planStep(el) { const pl = S.plan.find((x) => x.id === el.dataset.id); pl.n += +el.dataset.k; if (pl.n <= 0) S.plan = S.plan.filter((x) => x !== pl); save(); },
  planClear() { ask('Clear the whole plan?', 'Clear plan', () => { const old = S.plan; S.plan = []; save(); toast('Plan cleared', null, () => { S.plan = old; }); }); },
  goMeals() { ui.mealPick = false; ui.app = 'cal'; lsSet('mmm.app', 'cal'); ui.tab = 'foods'; ui.foodsSeg = 'meals'; ui.day = null; ui.edit = { type: 'meal', id: null, draft: { name: '', items: [], fav: false } }; },
  // shopping
  cartToggle(el) { const k = el.dataset.k; const c = S.cart[k] || {}; c.on = !c.on; S.cart[k] = c; save(); },
  cartAmt(el) {
    const k = el.dataset.k; const { plan, low } = shopRows(); const r = [...plan, ...low].find((x) => x.key === k); if (!r) return;
    openQty(r.name, r.note, cartAmt(r), r.u, r.pack, (a) => { S.cart[k] = { on: true, a }; });
  },
  shopToggle(el) { const x = S.shop.find((y) => y.id === el.dataset.id); x.done = !x.done; save(); },
  shopRm(el) { S.shop = S.shop.filter((y) => y.id !== el.dataset.id); save(); },
  shopAmt(el) {
    const x = S.shop.find((y) => y.id === el.dataset.id); const mi = manualInfo(x);
    openQty(x.name, 'How much to buy', x.a || (mi.pack ? mi.pack.size : 0), mi.u, mi.pack, (a) => { x.a = a; });
  },
  shopAdd() { ui.shopAdd = { q: '' }; setTimeout(() => { const i = document.getElementById('shopQ'); if (i) i.focus(); }, 40); },
  closeShopAdd() { ui.shopAdd = null; },
  shopAddFree() { const n = ui.shopAdd.q.trim(); if (!n) return; S.shop.push({ id: uid(), name: n, foodId: null, sid: null, a: null, done: false }); save(); ui.shopAdd = null; },
  shopAddFood(el) { const f = food(el.dataset.id); S.shop.push({ id: uid(), name: f.name, foodId: f.id, sid: null, a: null, done: false }); save(); ui.shopAdd = null; },
  shopAddStash(el) { const it = sItem(el.dataset.id); S.shop.push({ id: uid(), name: sName(it), foodId: it.foodId || null, sid: it.id, a: null, done: false }); save(); ui.shopAdd = null; },
  shopShare() {
    const text = shopText();
    if (navigator.share) { navigator.share({ text }).catch(() => {}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => { toast('List copied'); render(); }, () => {});
  },
  cartCommit() {
    const snap = JSON.stringify({ stash: S.stash, shop: S.shop, cart: S.cart });
    const { plan, low } = shopRows(); let n = 0;
    [...plan, ...low].forEach((r) => {
      const c = S.cart[r.key]; if (!c || !c.on) return; n++;
      let it = r.it || (r.f && stashOf(r.f.id)); if (!it) { it = newStashItem(r.f); S.stash.push(it); }
      if (!hasPack(it) && r.pack) it.pack = { ...r.pack };
      addStock(it, c.a != null ? c.a : buyDefault(r));
    });
    S.shop.filter((x) => x.done).forEach((x) => {
      n++; const mi = manualInfo(x); const a = x.a || (mi.pack ? mi.pack.size : 0);
      if (!a || (!mi.f && !mi.it)) return;
      let it = mi.it; if (!it) { it = newStashItem(mi.f); S.stash.push(it); }
      if (!hasPack(it) && mi.pack) it.pack = { ...mi.pack };
      addStock(it, a);
    });
    S.shop = S.shop.filter((x) => !x.done); S.cart = {}; save();
    toast(n + (n === 1 ? ' item' : ' items') + ' put in Stash', null, () => { const o = JSON.parse(snap); S.stash = o.stash; S.shop = o.shop; S.cart = o.cart; });
  },
  closeQty() { ui.qty = null; },
  qtyView(el) {
    const q = ui.qty; const k = el.dataset.k; if (k === q.view) return;
    const v = num(document.getElementById('qtyIn').value); const base = q.view === 'pack' ? v * q.pack.size : v;
    q.view = k; q.str = String(Math.round((k === 'pack' ? base / q.pack.size : base) * 100) / 100);
  },
  qtySave() {
    const q = ui.qty; const v = num(document.getElementById('qtyIn').value); const base = q.view === 'pack' && q.pack ? v * q.pack.size : v;
    if (!(base >= 0)) return; q.onSave(base); save(); ui.qty = null;
  },
  export() {
    S.lastExport = Date.now(); save();
    const name = 'muscle-maker-backup-' + todayKey() + '.json';
    const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    try {
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'Muscle Maker backup' }).catch(() => {}); return; }
    } catch (e) { /* fall through to download */ }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('Backup exported');
  },
  import() { document.getElementById('importFile').click(); }
};
function openIconPick(kind, obj) {
  ui.iconPick = { title: 'Added to favorites', name: obj.name, get: () => obj.icon, set: (k) => { obj.icon = obj.icon === k ? null : k; save(); } };
}

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  ev.preventDefault();
  fn(el);
  render();
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.id === 'sheetQ') { ui.sheet.q = el.value; offSearch(el.value.trim().toLowerCase()); document.getElementById('sheetBody').innerHTML = searchResults(); }
  else if (el.id === 'foodsQ') { ui.foodsQ = el.value; document.getElementById('foodsList').innerHTML = foodsListHtml(); }
  else if (el.id === 'stashQ') { ui.stashQ = el.value; document.getElementById('stashList').innerHTML = stashListHtml(); }
  else if (el.id === 'shopQ') {
    ui.shopAdd.q = el.value; const q = el.value.trim().toLowerCase();
    const fs = q ? S.foods.filter((f) => f.name.toLowerCase().includes(q)).slice(0, 8) : [];
    const its = q ? S.stash.filter((it) => !it.foodId && sName(it).toLowerCase().includes(q)).slice(0, 4) : S.stash.filter((it) => isOut(it) && !S.shop.some((x) => x.sid === it.id || (x.foodId && x.foodId === it.foodId))).slice(0, 8);
    document.getElementById('shopAddBody').innerHTML = shopAddBody(q, fs, its);
  }
  else if (el.dataset.t) {
    const ty = el.dataset.t; const box = {}; document.querySelectorAll(`[data-t="${ty}"]`).forEach((i) => { box[i.dataset.m] = num(i.value); });
    const k = kcalOf({ p: box.p || 0, c: box.c || 0, f: box.f || 0 }); const dl = k - S.maintenance;
    document.getElementById('k-' + ty).textContent = fmt(k); document.getElementById('dl-' + ty).textContent = (dl >= 0 ? '+' : '−') + fmt(Math.abs(dl));
  }
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.id === 'ptTime' && ui.portion) {
    const [h, m] = el.value.split(':').map(Number); if (isNaN(h)) return;
    const d = parse(ui.portion.date); d.setHours(h, m || 0, 0, 0); ui.portion.ts = d.getTime();
  } else if (el.id === 'maint') {
    const v = Math.round(num(el.value)); if (v >= 800 && v <= 8000) { S.maintenance = v; save(); } else { info('Please enter a value between 800 and 8,000 kcal.'); render(); }
  } else if (el.dataset.mi != null && ui.edit && ui.edit.type === 'meal') { syncDraft(); render(); }
  else if ((el.dataset.d === 'start' || el.dataset.d === 'end') && ui.edit && ui.edit.type === 'period') { syncDraft(); render(); }
  else if (el.id === 'importFile') {
    const file = el.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const data = JSON.parse(rd.result);
        if (!data || !Array.isArray(data.foods) || !Array.isArray(data.log) || !Array.isArray(data.periods)) throw new Error('format');
        ask('Replace all data on this phone with this backup (' + data.log.length + ' entries, ' + data.foods.length + ' foods' + (data.stash ? ', ' + data.stash.length + ' Stash items' : '') + ')?', 'Replace', () => { S = migrate(data); save(); ui.edit = null; toast('Backup imported'); });
      } catch (e) { info('That file is not a Muscle Maker backup.'); }
      render();
      el.value = '';
    };
    rd.readAsText(file);
  }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && ev.target.id === 'sheetQ') ev.target.blur();
  if (ev.key === 'Enter' && ev.target.id === 'shopQ') { ev.preventDefault(); A.shopAddFree(); render(); }
  if (ev.key === 'Enter' && ev.target.id === 'qtyIn') { ev.preventDefault(); A.qtySave(); render(); }
  if (ev.key === 'Escape' && ui.appMenu) { ui.appMenu = false; render(); }
});

/* ---------- screen fit ----------
   iOS 26 sometimes sizes viewport-filling fixed layouts wrong (tab bar floats, content shifts up).
   We size #app from the real window height; on the Home Screen app we use the full screen height.
   ADJ adds to the top / bottom safe areas (Settings → Screen fit), stored per device. */
let SHORT = false;
const ADJ = (() => { try { const a = JSON.parse(lsGet('mmm.adj', '{}')); return { t: Math.round(num(a.t)), b: Math.round(num(a.b)) }; } catch (e) { return { t: 0, b: 0 }; } })();
function fit() {
  const root = document.documentElement;
  // iOS can leave the whole page scrolled up (e.g. after the keyboard closes); the app never scrolls the page itself, so snap it back
  if (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop) { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; }
  const standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  const portrait = window.innerWidth < window.innerHeight;
  const ins = safeInsets();
  /* iOS 26 Home Screen bug: the page starts under the status bar but is cut short by the status bar's height at the bottom,
     so it never reaches the home indicator. Then the bottom safe area is empty space we can't use: drop it. */
  SHORT = standalone && portrait && ins.t > 20 && Math.abs(screen.height - window.innerHeight - ins.t) <= 4;
  root.style.setProperty('--apph', window.innerHeight + 'px');
  if (SHORT) root.style.setProperty('--sbBase', '4px'); else root.style.removeProperty('--sbBase');
  root.style.setProperty('--adjT', ADJ.t + 'px'); root.style.setProperty('--adjB', ADJ.b + 'px');
}
fit();
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 300));
window.addEventListener('pageshow', fit);
window.addEventListener('scroll', () => { if (window.scrollY) fit(); }, { passive: true });
document.addEventListener('focusout', () => setTimeout(fit, 120));
if (window.visualViewport) { visualViewport.addEventListener('resize', () => setTimeout(fit, 60)); visualViewport.addEventListener('scroll', () => { if (!document.activeElement || !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) fit(); }); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(fit, 50); });
setTimeout(fit, 300);
/* numbers for Settings → Screen fit, to diagnose layout problems on the phone */
function safeInsets() {
  const pr = document.createElement('div');
  pr.style.cssText = 'position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
  document.body.appendChild(pr); const cs = getComputedStyle(pr); const r = { t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0 }; pr.remove();
  return r;
}
function screenInfo() {
  const si = safeInsets(); const st = si.t, sb = si.b;
  const standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  const vv = window.visualViewport; const app = document.getElementById('app').getBoundingClientRect();
  return (standalone ? 'Home Screen app' : 'Browser') + ' · window ' + window.innerWidth + '×' + window.innerHeight + ' · screen ' + screen.width + '×' + screen.height +
    ' · safe ' + Math.round(st) + '/' + Math.round(sb) + ' · vv ' + (vv ? Math.round(vv.height) + ' @' + Math.round(vv.offsetTop) : '–') + ' · scroll ' + Math.round(window.scrollY) + ' · app ' + Math.round(app.top) + '–' + Math.round(app.bottom) + (SHORT ? ' · short-fix' : '') + ' · v2.4';
}

render();
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|claudeusercontent/.test(location.host)) {
  const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((r) => r.update()).catch(() => {});
  // when a new version of the app takes over, reload once so it shows right away
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !reloaded) { reloaded = true; location.reload(); } });
}
